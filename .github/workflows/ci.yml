name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# A new push to a PR cancels that PR's in-flight run. Runs on main never
# cancel: Railway's Wait for CI needs every main commit's run to finish. Main
# gets a per-run group rather than a shared one because a shared group would
# still replace a queued run when a third commit lands, even without
# cancel-in-progress.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iridium_test
    VOLTAGENT_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/voltagent_test
    BETTER_AUTH_SECRET: test-secret-do-not-use-in-production!!
    BETTER_AUTH_BASE_URL: http://localhost:5173
    ANTHROPIC_API_KEY: test-key-not-used-in-e2e

jobs:
    # Unit tests share this job's install and Prisma setup: they take a few
    # seconds, less than a separate job spends on setup.
    validate:
        name: Validate + Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Cache Bun packages
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Generate Prisma client
              run: bunx --bun prisma generate
            - name: Validate
              run: bun run validate
            - name: Run unit tests
              run: bun run test

    e2e:
        name: Playwright
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # No `needs`: e2e runs alongside validate to keep the critical path
        # short. Railway's Wait for CI still waits for the whole run.

        # The health checks probe over TCP: during first-boot init the image
        # runs a socket-only temporary server that a plain `pg_isready` would
        # report as ready.
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: iridium_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 15

            voltagent:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: voltagent_test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 15

        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Cache Bun packages
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: bun-${{ runner.os }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate Prisma client
              run: bunx --bun prisma generate

            - name: Run migrations
              run: bunx --bun prisma migrate deploy

            # Browser builds depend on the Playwright version and the runner
            # image (ImageOS changes when ubuntu-latest moves to a new release).
            - name: Resolve Playwright cache key
              id: playwright
              run: |
                  version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
                  echo "cache-key=playwright-${ImageOS}-${RUNNER_ARCH}-${version}-chromium" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ steps.playwright.outputs.cache-key }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: bunx playwright install --with-deps chromium

            # The cache holds the browsers but not their apt packages.
            - name: Install Playwright system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: bunx playwright install-deps chromium

            - name: Run e2e tests
              run: bunx playwright test --project=chromium

            # Upload before the visual run: a second `playwright test`
            # invocation rewrites playwright-report/ and clears test-results/.
            - name: Upload test report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

            - name: Run visual inventory
              if: ${{ !cancelled() }}
              run: PW_VISUAL=1 bunx playwright test --project=visual

            - name: Upload visual inventory
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: visual-inventory
                  path: |
                      test-results/visual-inventory/
                      playwright-report/
                  retention-days: 14

    # Builds the production image and boots it the way Railway does, so a
    # broken production install, build, migration, or env check fails CI
    # instead of the deploy.
    docker:
        name: Docker image
        runs-on: ubuntu-latest
        timeout-minutes: 15

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: iridium_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 15

            voltagent:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: voltagent_test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 15

        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v4

            - name: Build image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: false
                  load: true
                  tags: iridium:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Host networking lets the container reach the service databases
            # at the workflow's localhost DATABASE_URL and VOLTAGENT_DATABASE_URL.
            # The image's CMD runs `prisma migrate deploy` before serving.
            - name: Boot image and wait for /healthcheck
              run: |
                  docker run -d --name iridium --network host \
                      -e NODE_ENV=production \
                      -e DATABASE_URL \
                      -e VOLTAGENT_DATABASE_URL \
                      -e BETTER_AUTH_SECRET \
                      -e BETTER_AUTH_BASE_URL=http://localhost:3000 \
                      iridium:ci
                  for _ in $(seq 1 45); do
                      if curl -fsS --max-time 5 http://localhost:3000/healthcheck; then
                          echo
                          exit 0
                      fi
                      if [ "$(docker inspect -f '{{.State.Running}}' iridium)" != true ]; then
                          echo "::error::The container exited before /healthcheck returned 200"
                          docker logs iridium
                          exit 1
                      fi
                      sleep 2
                  done
                  echo "::error::/healthcheck did not return 200 within 90s"
                  docker logs iridium
                  exit 1

    deploy:
        name: Deploy (Railway)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [e2e]
        # Only deploy on pushes to main (not PRs). The deploy step itself is a
        # no-op until a RAILWAY_TOKEN repo secret exists, so forks and clones
        # without Railway configured stay green.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Deploy to Railway
              if: ${{ env.RAILWAY_TOKEN != '' }}
              # `railway up` builds the Dockerfile; migrations then run once as
              # the pre-deploy command from .railway/railway.ts, not on boot.
              # Use a project-scoped token; set RAILWAY_SERVICE if the project has
              # more than one service.
              run: bunx @railway/cli up --ci ${RAILWAY_SERVICE:+--service "$RAILWAY_SERVICE"}
              env:
                  RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
            - name: Skipped (no RAILWAY_TOKEN)
              if: ${{ env.RAILWAY_TOKEN == '' }}
              run: echo "RAILWAY_TOKEN not set — skipping deploy. Add it in repo secrets to enable."
