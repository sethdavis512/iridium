# Pin the project name so container/volume names stay deterministic regardless
# of the working directory. Without this, Compose derives the name from the
# folder, so cloning/renaming the repo orphans the old containers and volumes
# (they become invisible to `docker compose down` / `docker:nuke`).
name: iridium

# Host ports come from POSTGRES_PORT / VOLTAGENT_POSTGRES_PORT (read from .env
# or the shell), defaulting to 5432/5433. `bun run setup` picks free ones when
# another project already holds those, so copies can run side by side.
services:
    postgres:
        image: postgres:16-alpine
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: iridium
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 3s
            retries: 5

    postgres-voltagent:
        image: postgres:16-alpine
        ports:
            - '${VOLTAGENT_POSTGRES_PORT:-5433}:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: voltagent
        volumes:
            - pgdata_voltagent:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    pgdata:
    pgdata_voltagent:
