# Pin the project name so container/volume names stay deterministic regardless
# of the working directory. Without this, Compose derives the name from the
# folder, so cloning/renaming the repo orphans the old containers and volumes
# (they become invisible to `docker compose down` / `docker:nuke`).
name: iridium

services:
    postgres:
        image: postgres:16-alpine
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: iridium
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 3s
            retries: 5

    postgres-voltagent:
        image: postgres:16-alpine
        ports:
            - '5433:5432'
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: voltagent
        volumes:
            - pgdata_voltagent:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    pgdata:
    pgdata_voltagent:
